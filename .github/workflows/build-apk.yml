name: Build Android APK

# Builds a ready-to-install APK on GitHub's servers.
# Run it from the GitHub website: Actions tab -> Build Android APK ->
# Run workflow. Download the finished APK from the run's Artifacts box.
on:
  workflow_dispatch:
  push:
    branches: [claude/padel-booking-app-t7fksj]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - run: flutter pub get

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: lets-padel-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
