<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Book padel courts at Let's Padel — Airport Road & Hazmieh.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Let's Padel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Let's Padel</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Branded loading screen while the app downloads (slow
       connections see this for up to a minute on first visit). */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #ffffff;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
    }
    #loading img { width: 180px; max-width: 60vw; }
    #loading p { color: #173F63; font-size: 15px; margin: 0; }
    #loading .spin {
      width: 34px;
      height: 34px;
      border: 4px solid #e2e8f0;
      border-top-color: #C9E62E;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-512.png" alt="Let's Padel">
    <div class="spin"></div>
    <p>Loading Let's Padel…</p>
  </div>
  <script>
    // Flutter fires this once the app has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
